name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Run type and behavior checks
        run: npm run check

      - name: Verify MCP client connection
        run: npm run check:mcp

      - name: Build production application
        run: npm run build

      - name: Install browser for UI checks
        run: npx playwright install --with-deps chromium

      - name: Verify desktop and mobile states
        run: npm run test:e2e

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pinned audit CLI without changing project dependencies
        run: npm install --prefix "$RUNNER_TEMP/actionlock-auditor" --ignore-scripts --no-audit --no-fund --fetch-timeout=20000 --fetch-retries=0 npm@12.0.2

      - name: Audit locked production dependencies
        run: node "$RUNNER_TEMP/actionlock-auditor/node_modules/npm/bin/npm-cli.js" audit --package-lock-only --omit=dev --fetch-timeout=30000 --fetch-retries=1

  # Preserve the existing required check name; neither lane may fail or be skipped.
  verify:
    if: ${{ always() }}
    needs: [checks, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require tests and dependency audit
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          echo "Behavior checks: $CHECKS_RESULT"
          echo "Dependency audit: $AUDIT_RESULT"
          test "$CHECKS_RESULT" = success
          test "$AUDIT_RESULT" = success
