name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run type and behavior checks
        run: npm run check

      - name: Verify MCP client connection
        run: npm run check:mcp

      - name: Build production application
        run: npm run build

      - name: Install browser for UI checks
        run: npx playwright install --with-deps chromium

      - name: Verify desktop and mobile states
        run: npm run test:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev --fetch-timeout=30000 --fetch-retries=1
